syntax = "proto3";

package api.proto.v1;

option go_package = "github.com/quang/social-network/pkg/pb/v1;pb";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service SocialService {
rpc GetListBlockByUserID (UserblockIDRequest) returns (ListBlockByUserIDResponse);
rpc GetListBlockByUserIDV2 (UserblockIDRequestv2) returns (ListBlockByUserIDResponse);
rpc GetInfoUserByID (UserSocialIDRequest) returns (InfoUserByIDResponse);
}
message UserblockIDRequest {
    string user_id = 1;
    string user_id2 = 2;
}
message UserblockIDRequestv2 {
    string user_id = 1;
}
message ListBlockByUserIDResponse {
    repeated string typeblock = 1;
}
message UserSocialIDRequest {
    string user_id = 1;
}
message InfoUserByIDResponse {
    string user_id = 1;
    string AuthorName = 2;
    string AuthorAvatar = 3;
}