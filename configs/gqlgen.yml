# Đường dẫn tính từ root (không cần ../ nữa)
schema:
  - internal/common/graphQL/schema/*.graphqls

exec:
  filename: internal/common/graphQL/generated/generated.go
  package: generated

model:
  filename: internal/common/graphQL/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graphQL/resolver
  package: resolver
  filename_template: "{name}.resolvers.go"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32