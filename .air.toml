#:schema https://json.schemastore.org/any.json

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # 1. Output file nằm ngay tại thư mục gốc/tmp để dễ quản lý
  bin = "tmp\\main.exe"  
poll = false
poll_interval = 0
  # 2. Lệnh build chuẩn cho Windows (Bỏ 'env GOOS...', Go tự nhận diện môi trường)
  cmd = "go build -o ./tmp/main.exe ./cmd/api"

  # 3. Chạy wire gen trước khi build
  pre_cmd = ["wire gen ./cmd/api"]

  # 4. Các cấu hình phụ trợ
  args_bin = []
  delay = 2000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  
  # Quan trọng: Bỏ qua file wire sinh ra để tránh vòng lặp build vô tận
  exclude_file = ["cmd/api/wire_gen.go", "cmd\\api\\wire_gen.go"]
  exclude_regex =["_test.go", "wire_gen.go", ".*_enumer.go", ".*_string.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "env"]
  include_file = []
  kill_delay = "3s"
  log = "build-errors.log"
  post_cmd = []
  rerun = false
  rerun_delay = 1000
  send_interrupt = true
  
  # Nên bật true để nếu wire gen lỗi thì không build tiếp
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true